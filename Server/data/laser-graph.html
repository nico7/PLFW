<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laser</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="stylesheet" href="/style.css">

</head>

<body id="wrapper">
    <h2>Laser DAC</h2>
    <div id="LASER DAC" class="container"></div>
    <div id="LASER Current" class="container"></div>

    <script>
        var sampling_period = 100;
        var data_buffer = 100;
        var laserDacChart = new Highcharts.Chart({
            chart: {
                renderTo: 'LASER DAC',
                backgroundColor: '#4A4A4A'
            },
            title: {
                text: 'LASER',
                style: {
                    color: '#FFFFFF'
                }
            },
            series: [{
                showInLegend: false,
                data: []
            }],
            plotOptions: {
                line: {
                    animation: false,
                    dataLabels: { enabled: false }
                },
                series: { color: '#00d78c' },
                style: {
                    color: '#FFFFFF'
                }
            },
            xAxis: {
                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                type: 'datetime',
                dateTimeLabelFormats: { second: '%S' },
            },
            yAxis: {
                
                min: 0,
                max: 256,

                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                title: {
                    text: 'DAC VALUE',
                    style: {
                        color: '#FFFFFF'
                    }
                },
            },
            credits: { enabled: false }
        });
        setInterval(function () {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var x = (new Date()).getTime(),
                        y = parseFloat(this.responseText);
                    //console.log(this.responseText);
                    if (laserDacChart.series[0].data.length > data_buffer) {
                        laserDacChart.series[0].addPoint([x, y], true, true, false);
                    } else {
                        laserDacChart.series[0].addPoint([x, y], true, false, false);
                    }
                }
            };
            xhttp.open("GET", "/laserdac", true);
            xhttp.send();
        }, sampling_period);

        var laserCurrentChart = new Highcharts.Chart({
            chart: {
                renderTo: 'LASER Current',
                backgroundColor: '#4A4A4A'
            },
            title: {
                text: 'Current',
                style: {
                    color: '#FFFFFF'
                }
            },
            series: [{
                showInLegend: false,
                data: []
            }],
            plotOptions: {
                line: {
                    animation: false,
                    dataLabels: { enabled: false }
                },
                series: { color: '#D1122E' }
            },
            xAxis: {
                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                type: 'datetime',
                dateTimeLabelFormats: { second: '%S' }
            },
            yAxis: {
                min: 0,
                max: 500,
                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                title: {
                    text: 'mA',
                    style: {
                        color: '#FFFFFF'
                    }
                }
            },
            credits: { enabled: false }
        });
        setInterval(function () {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var x = (new Date()).getTime(),
                        y = parseFloat(this.responseText);
                    //console.log(this.responseText);
                    if (laserCurrentChart.series[0].data.length > data_buffer) {
                        laserCurrentChart.series[0].addPoint([x, y], true, true, false);
                    } else {
                        laserCurrentChart.series[0].addPoint([x, y], true, false, false);
                    }
                }
            };
            xhttp.open("GET", "/lasercurrent", true);
            xhttp.send();
        }, sampling_period);


        function scaleToFit() {
            const baseWidth = 1920;
            const baseHeight = 1080;
            const scaleX = window.innerWidth / baseWidth;
            const scaleY = window.innerHeight / baseHeight;
            const scale = Math.min(scaleX, scaleY);

            const wrapper = document.getElementById('wrapper');
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', scaleToFit);
        window.addEventListener('load', scaleToFit);

    </script>

</body>

</html>
