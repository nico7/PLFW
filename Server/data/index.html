<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div style="margin-bottom: 20px;" class="container">
    <label style="color: white; font-weight: bold;">LASER</label>
    <div style="display: flex; align-items: center; gap: 15px; margin-top: 8px;">
      
      <!-- Toggle switch -->
      <label style="display: flex; align-items: center; gap: 5px; color: white;">
        ON/OFF
        <label class="switch">
          <input type="checkbox" id="laserToggle">
          <span class="slider round"></span>
        </label>
      </label>

      <div class="led-container">
        <label for="led" class="led-label">Fault</label>
        <div id="led" class="led off"></div>
      </div>
  
      <!-- Input field and send button -->
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="display: flex; flex-direction: column;">
          <label for="laserCurrentValue" style="color: white;">Laser Current (mA)</label>
          <input type="number" id="laserCurrentValue" step="1" min="0" style="width: 100px;">
        </div>
        <button id="sendLaserValuesButton" style="background-color: #e74c3c">Send</button>
      </div>
  
    </div>
  </div>

  </div>
  <div id="LASER DAC" class="container"></div>
  <div id="LASER Current" class="container"></div>
  <div id="TEC DAC" class="container"></div>
  <div id="TEC Current" class="container"></div>
  <div id="TEC Temperature" class="container"></div>
  <div id="Heater Current" class="container"></div>

  </body>
  <script src="graphs.js"></script>
</html>
