<!DOCTYPE HTML>
<html>

<head>
  <meta name="viewport" content="width=device-width, height=device-height initial-scale=1">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body id="wrapper">
  <!-- -------------------------------------------------------  LASER  --------------------------------------------------------------- -->
  <div class="container" style="margin-bottom: 5px;">
    <label style="color: white; font-weight: bold; font-size: 35px;">LASER</label>

    <div class="outer-grid" style="border-top: 2px solid black;">

      <div class="left-side-grid" style="border-right: 2px solid black;">
        <!-- ON/OFF Switch -->
        <div class="grid-item">
          <label for="laserToggle">ON/OFF</label>
          <label class="switch">
            <input type="checkbox" id="laserToggle">
            <span class="slider round"></span>
          </label>
        </div>


        <!-- Laser Current Input -->
        <div class="grid-item">
          <label for="laserDACvalue">Current DAC [0 - 255]</label>
          <input type="number" id="laserDACvalue" step="1" min="0">
        </div>

        <!-- Send Button -->
        <div class="grid-item">
          <label>SET DAC</label>
          <button class="button button-red" id="sendLaserValuesButton"
            style="background-color: #e74c3c; width: 90%;">Send</button>
        </div>
      </div>

      <div class="right-side-grid">

        <!-- Laser On LED -->
        <div class="grid-item">
          <div class="led-container">
            <label for="laser_on_led" class="led-label">ON/OFF</label>
            <div id="laser_on_led" class="led off"></div>
          </div>
        </div>

        <!-- Laser Fault LED -->
        <div class="grid-item">

          <div class="led-container">
            <label for="laser_fault_led" class="led-label">FAULT</label>
            <div id="laser_fault_led" class="led off"></div>
          </div>
        </div>

        <!-- Show Graph Button -->
        <div class="grid-item">
          <label>SHOW</label>
          <button class="button button-blue" id="showLaserGraphButton"
            style="background-color: #3498db; color: white; width:90%; margin-right:10px; border: none;  ">
            Graphs
          </button>
          <div id="laserOutputContainer">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span id="laserCurrentLabel">Current (mA):</span>
              <span id="laserOutputField" class="live"></span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <!-- --------  /LASER  ------------------>

  <!-- ----------  TEC  ------------------->
  <div style="margin-bottom: 5px;" class="container">
    <label style="color: white; font-weight: bold; margin-bottom: 10px; font-size: 35px;">TEC</label>

    <div class="outer-grid" style="border-top: 2px solid black;">

      <div class="left-side-grid" style="border-right: 2px solid black;">
        <!-- ON/OFF Switch -->
        <div class="grid-item">
          <label for="tecToggle">ON/OFF</label>
          <label class="switch">
            <input type="checkbox" id="tecToggle">
            <span class="slider round"></span>
          </label>
        </div>


        <!-- TEC Current Input -->
        <div class="grid-item">
          <label for="tecDACvalue">Current DAC [0 - 255]</label>
          <input type="number" id="tecDACvalue" step="1" min="0">
        </div>

        <!-- Send Button -->
        <div class="grid-item">
          <label>SET DAC</label>
          <button class="button button-red" id="sendTecValuesButton"
            style="background-color: #e74c3c; width: 90%;">Send</button>
        </div>

      </div>

      <div class="right-side-grid">

        <!-- TEC On LED -->
        <div class="grid-item">
          <div class="led-container">
            <label for="tec_on_led" class="led-label">ON/OFF</label>
            <div id="tec_on_led" class="led off"></div>
          </div>
        </div>

        <!-- TEC Fault LED -->
        <div class="grid-item">
          <div class="led-container">
            <label for="tec_fault_led" class="led-label">FAULT</label>
            <div id="tec_fault_led" class="led off"></div>
          </div>
        </div>

        <!-- Show Graph Button -->
        <div class="grid-item">
          <label>SHOW</label>
          <button class="button button-blue" id="showTecGraphButton"
            style="background-color: #3498db; color: white; width:90%; margin-right:10px; border: none;  ">
            Graphs
          </button>
          <div id="tecOutputContainer">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span id="tecCurrentLabel">Current (mA):</span>
              <span id="tecOutputField" class="live"></span>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- ----------  /TEC  ------------------->


  <div style="margin-bottom: 20px;" class="container">
    <label style="color: white; font-weight: bold; margin-bottom: 10px; font-size: 35px;">READINGS & TIMER</label>

    <div class="control-grid_misc" style="border-top: 3px solid black; padding: 20px;">
      <div class="grid-item">
        <label>TOGGLE</label>
        <button class="button button-orange" id="toggleTecTempButton" style="width: 90%;">Temperature Graph</button>
        <div id="tempOutputContainer">
          <span id="tempOutputField" class="live">1</span>
        </div>
      </div>

      <div class="grid-item">
        <label>TOGGLE</label>
        <button class="button button-yellow" id="toggleHeaterButton" style="width: 90%;">Heater Graph</button>
        <div id="heaterOutputContainer">
          <span id="heaterOutputField" class="live">2</span>
        </div>
      </div>


    </div> <!-- control-grid -->
  </div>

</body>
<script src="graphs.js"></script>

</html>
