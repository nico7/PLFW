<script>
  var sampling_period = 1000;
  var data_buffer = 100;
var laserDacChart = new Highcharts.Chart({
  chart:{ renderTo : 'LASER DAC' },
  title: { text: 'LASER' },
  series: [{
    showInLegend: false,
    data: []
  }],
  plotOptions: {
    line: { animation: false,
      dataLabels: { enabled: true }
    },
    series: { color: '#059e8a' }
  },
  xAxis: { type: 'datetime',
    dateTimeLabelFormats: { second: '%H:%M:%S' }
  },
  yAxis: {
    title: { text: 'DAC VALUE' }
  },
  credits: { enabled: false }
});
setInterval(function ( ) {
  var xhttp = new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
      var x = (new Date()).getTime(),
          y = parseFloat(this.responseText);
      console.log(this.responseText);
      if(laserDacChart.series[0].data.length > data_buffer) {
        laserDacChart.series[0].addPoint([x, y], true, true, true);
      } else {
        laserDacChart.series[0].addPoint([x, y], true, false, true);
      }
    }
  };
  xhttp.open("GET", "/laserdac", true);
  xhttp.send();
}, sampling_period ) ;
