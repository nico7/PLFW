<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TEC</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="stylesheet" href="/style.css">

</head>

<body id="wrapper">
    <h2>TEC</h2>
    <div id="TEC DAC" class="container"></div>
    <div id="TEC Current" class="container"></div>

    <script>
        var sampling_period = 100;
        var data_buffer = 100;
        var tecDacChart = new Highcharts.Chart({
            chart: {
                renderTo: 'TEC DAC',
                backgroundColor: '#4A4A4A'
            },
            title: {
                text: 'TEC DAC',
                style: {
                    color: '#FFFFFF'
                }
            },
            series: [{
                showInLegend: false,
                data: []
            }],
            plotOptions: {
                line: {
                    animation: false,
                    dataLabels: { enabled: false }
                },
                series: { color: '#18009c' }
            },
            xAxis: {
                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                type: 'datetime',
                dateTimeLabelFormats: { second: '%S' }
            },
            yAxis: {
                min: 0,
                max: 256,
                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                title: {
                    text: 'TEC DAC value',
                    style: {
                        color: '#FFFFFF'
                    }
                }
            },
            credits: { enabled: false }
        });
        setInterval(function () {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var x = (new Date()).getTime(),
                        y = parseFloat(this.responseText);
                    //console.log(this.responseText);
                    if (tecDacChart.series[0].data.length > data_buffer) {
                        tecDacChart.series[0].addPoint([x, y], true, true, false);
                    } else {
                        tecDacChart.series[0].addPoint([x, y], true, false, false);
                    }
                }
            };
            xhttp.open("GET", "/tecdac", true);
            xhttp.send();
        }, sampling_period);

        var tecCurrentChart = new Highcharts.Chart({
            chart: {
                renderTo: 'TEC Current',
                backgroundColor: '#4A4A4A'
            },
            title: {
                text: 'TEC Current',
                style: {
                    color: '#FFFFFF'
                }
            },
            series: [{
                showInLegend: false,
                data: []
            }],
            plotOptions: {
                line: {
                    animation: false,
                    dataLabels: { enabled: false }
                },
                series: { color: '#18009c' }
            },
            xAxis: {
                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                type: 'datetime',
                dateTimeLabelFormats: { second: '%S' }
            },
            yAxis: {
                min: 0,
                max: 2010,
                labels: {
                    style: {
                        color: '#FFFFFF'
                    }
                },
                title: {
                    text: 'mA',
                    style: {
                        color: '#FFFFFF'
                    }
                }
            },
            credits: { enabled: false }
        });
        setInterval(function () {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var x = (new Date()).getTime(),
                        y = parseFloat(this.responseText);
                    //console.log(this.responseText);
                    if (tecCurrentChart.series[0].data.length > data_buffer) {
                        tecCurrentChart.series[0].addPoint([x, y], true, true, false);
                    } else {
                        tecCurrentChart.series[0].addPoint([x, y], true, false, false);
                    }
                }
            };
            xhttp.open("GET", "/teccurrent", true);
            xhttp.send();
        }, sampling_period);

        function scaleToFit() {
            const baseWidth = 1920;
            const baseHeight = 1080;
            const scaleX = window.innerWidth / baseWidth;
            const scaleY = window.innerHeight / baseHeight;
            const scale = Math.min(scaleX, scaleY);

            const wrapper = document.getElementById('wrapper');
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', scaleToFit);
        window.addEventListener('load', scaleToFit);
    </script>
</body>

</html>
